server:
  port: 8080

spring:
  application:
    name: notification-service
  #
  # Database Configurations
  #
  datasource:
    url: jdbc:postgresql://${DB_NTF_HOST:localhost}:${DB_NTF_PORT:5432}/${DB_NTF_SID:postgres}
    username: ${DB_NTF_USER:postgres}
    password: ${DB_NTF_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
  #
  # Flyway Configurations
  # { Config for Database Migration }
  #
  flyway:
    enabled: true
    default-schema: ${DB_MIGRATI0N_DEFAULT_SCHEMA:notification}
    schemas:
      - notification
    create-schemas: ${DB_MIGRATION_CREATE_SCHEMAS:true}
    locations: ${DB_MIGRATION_SQL_LOCATION:classpath:db/migration}
    baseline-on-migrate: ${DB_MIGRATION_BASELINE_ON_MIGRATE:true}
    baseline-version: ${DB_MIGRATION_BASELINE_VERSION:1}
  #
  # Spring Kafka Configurations
  # { Config for Kafka: Server, Consumer, Producer, Listener }
  #
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    #
    # { Kafka Consumer }
    #
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    #
    # { Kafka Listener }
    #
    listener:
      ack-mode: manual
      type: single
  #
  # Mail Configurations
  # { Configurations for Spring Mail }
  #
  mail:
    host: ${NOTIFICATION_EMAIL_HOST:smtp.gmail.com}
    port: ${NOTIFICATION_EMAIL_PORT:587}
    username: ${NOTIFICATION_EMAIL_USERNAME:}
    password: ${NOTIFICATION_EMAIL_PASSWORD:}
    properties:
      mail:
        transport:
          protocol: ${NOTIFICATION_EMAIL_TRANSFER_PROTOCOL:smtp}
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: ${NOTIFICATION_EMAIL_SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${NOTIFICATION_EMAIL_SMTP_TIMEOUT:10000}
          writetimeout: ${NOTIFICATION_EMAIL_SMTP_WRITE_TIMEOUT:10000}
#
# Service Configuration Properties
# { Configurations for Notification Service }
#
notification-service:
  kafka:
    topic:
      notification-requested: ${KAFKA_TOPIC_NOTIFICATION_REQUESTED:notification.requested}
      notification-dlt: ${KAFKA_TOPIC_NOTIFICATION_DLT:notification.requested.dlt}
  email:
    from: ${NOTIFICATION_EMAIL_FROM:sample@mail.com}
  retry:
    max-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
    wait-duration-millis: ${NOTIFICATION_RETRY_WAIT_DURATION_MILLIS:1000}
    fail-after-max-attempts: ${NOTIFICATION_RETRY_FAIL_AFTER_MAX_ATTEMPTS:true}

#
# Actuator Configurations
# { Configurations for Health, Metrics, and Operational Endpoints }
#
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
    kafka:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}] [kafka:%X{kafkaTopic:-}:%X{kafkaPartition:-}:%X{kafkaOffset:-}] %logger{36} - %msg%n"
  level:
    org.flywaydb: INFO
